# "Despertador": o Supabase grátis PAUSA o projeto depois de ~7 dias sem nenhum acesso (férias,
# recesso). Esta tarefa do GitHub acessa o banco de cada escola 2 vezes por semana, para ele não dormir.
#
# Configurar (uma vez): no GitHub, Settings > Secrets and variables > Actions > New repository secret
#   Nome: ESCOLAS
#   Valor: uma linha por escola, no formato   <endereço do Supabase> <chave PÚBLICA>
#     https://abcd1234.supabase.co sb_publishable_xxxxxxxx
#   (linhas vazias e linhas começando com # são ignoradas). NUNCA a chave secreta.
#
# Se uma escola não responder, a tarefa falha e o GitHub manda e-mail para o dono do repositório:
# provavelmente o projeto já pausou (entrar no Supabase e clicar em "Restore project").
# Atenção: o GitHub desliga tarefas agendadas de repositório público sem nenhuma mudança por 60 dias
# (ele avisa por e-mail antes; basta clicar em "Enable workflow" na aba Actions).
name: Despertador do Supabase

on:
  schedule:
    - cron: '17 12 * * 1,4'   # segundas e quintas, 9h17 (horário de Brasília)
  workflow_dispatch:          # botão "Run workflow" para testar na hora

permissions: {}

jobs:
  acordar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acessar o banco de cada escola
        env:
          ESCOLAS: ${{ secrets.ESCOLAS }}
        run: |
          if [ -z "$ESCOLAS" ]; then
            echo "O segredo ESCOLAS não foi configurado (veja o topo deste arquivo)."
            exit 1
          fi
          n=0; falhas=0
          while read -r url chave _; do
            case "$url" in ''|'#'*) continue ;; esac
            n=$((n + 1))
            echo "::add-mask::$url"
            echo "::add-mask::$chave"
            codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -X POST \
              "$url/rest/v1/rpc/escola_tem_admin" \
              -H "apikey: $chave" -H "Content-Type: application/json" -d '{}') || codigo=000
            if [ "$codigo" = "200" ]; then
              echo "Escola $n: acordada."
            else
              echo "Escola $n: NÃO respondeu (HTTP $codigo). Talvez esteja pausada: entre no Supabase e clique em Restore project."
              falhas=$((falhas + 1))
            fi
          done <<< "$ESCOLAS"
          echo "Escolas: $n · sem resposta: $falhas"
          [ "$n" -gt 0 ] && [ "$falhas" -eq 0 ]
