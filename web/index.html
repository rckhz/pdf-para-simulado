<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulados</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#172033;background:#f3f5f9}*{box-sizing:border-box}
    body{margin:0;padding:22px 12px;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .caixa{max-width:520px;width:100%;background:#fff;border:1px solid #e1e6ef;border-radius:18px;box-shadow:0 5px 20px #14213d0a;padding:30px 24px;text-align:center}
    h1{margin:0 0 6px;font-size:26px}.muted{color:#64748b;font-size:15px;margin:0 0 24px}
    .opcao{display:block;text-decoration:none;margin-top:12px;padding:20px;border-radius:14px;font-size:19px;font-weight:700}
    .opcao small{display:block;font-size:13px;font-weight:400;margin-top:4px;opacity:.85}
    .aluno{background:#2563eb;color:#fff}.aluno:hover{background:#1d4ed8}
    .professor{background:#e8edf5;color:#1e293b}.professor:hover{background:#dbe3ef}
  </style>
</head>
<body>
  <main class="caixa">
    <h1>Simulados</h1>
    <p class="muted">Quem é você?</p>
    <a class="opcao aluno" href="aluno.html">Sou aluno<small>Entrar numa prova com o código ou o link do professor</small></a>
    <a class="opcao professor" href="professor.html">Sou professor<small>Criar simulados, gabaritos e ver resultados</small></a>
  </main>
</body>
</html>
